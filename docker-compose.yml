# 豆包 TTS OpenAI 兼容服务（TypeScript 版）
#
# 首次使用:
#   1. cp .env.example .env          # 至少改掉 DOUBAO_TTS_API_KEY
#   2. 准备 cookie（写进 data 目录，续期会原地回写）:
#        mkdir -p data
#        printf '%s' "浏览器复制的完整 Cookie 头" > data/.store_cookie
#   3. docker compose up -d
#
# 说明: 挂载的是 data 目录（不是单个文件），避免续期覆写时 rename 失败。

services:
  doubao-tts:
    image: ghcr.io/sewall2025/doubao-tts-ts:main
    container_name: doubao-tts-ts
    restart: unless-stopped

    # .env 里的变量注入为环境变量（优先级高于容器内默认值）
    env_file:
      - .env

    ports:
      # 左侧宿主端口可改；右侧固定 8000（镜像内监听端口）
      - "8000:8000"

    # 容器内固定监听 0.0.0.0:8000，对外暴露由 ports 控制
    environment:
      DOUBAO_TTS_HOST: 0.0.0.0
      DOUBAO_TTS_PORT: 8000
      STORAGE_BACKEND: file
      DOUBAO_TTS_DATA_DIR: /data

    volumes:
      # cookie 持久化 + 保温续期回写；挂目录而非单文件
      - ./data:/data
      # 音色表挂出来，重新抓取后即时生效（可选）
      - ./voices.json:/app/voices.json

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
